<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timezone Converter</title>

<link rel="stylesheet" href="style.css">

<!-- Select2 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
      rel="stylesheet" />

<!-- Flatpickr -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">

</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌍 Timezone Converter</h1>
        <p>Convert time between cities worldwide</p>
    </div>

    <div class="form-group">
        <label>Date & Time</label>
        <input
            type="text"
            id="timeInput"
            placeholder="Select date and time">
    </div>

    <div class="button-row">
        <button class="secondary" onclick="setNow()">
            Current Time
        </button>

        <button class="secondary" onclick="swapTimezones()">
            ⇄ Swap
        </button>
    </div>

    <div class="form-group">
        <label>From Location</label>
        <select id="fromTimezone"></select>
    </div>

    <div class="form-group">
        <label>To Location</label>
        <select id="toTimezone"></select>
    </div>

    <button class="convert-btn" onclick="convertTime()">
        Convert
    </button>

    <div id="currentTime"></div>

    <div id="result"></div>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Select2 -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<!-- Luxon -->
<script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>

<!-- Flatpickr -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script src="script.js"></script>

</body>
</html>
