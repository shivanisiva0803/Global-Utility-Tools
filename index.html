<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timezone Converter</title>

  <link rel="stylesheet" href="style.css">

  <!-- Tom Select -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
</head>

<body>

<div class="container">

  <h1>🌍 Timezone Converter</h1>

  <label>Enter Time</label>
  <input type="datetime-local" id="timeInput">

  <button class="small-btn" onclick="setNow()">Use Current Time</button>

  <label>From Timezone</label>
  <select id="fromTimezone"></select>

  <label>To Timezone</label>
  <select id="toTimezone"></select>

  <button class="swap-btn" onclick="swapTimezones()">⇄ Swap</button>

  <button onclick="convertTime()">Convert</button>

  <div id="currentTime"></div>
  <div id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
<script src="script.js?v=3"></script>

</body>
</html>
